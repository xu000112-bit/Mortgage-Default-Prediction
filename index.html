<style id="qa-aligned-styles">
/* Q&A hotspots: viewport-fixed sibling of Reveal, NEVER a child of its scaled sections. */
#qa-video-map {
  position:fixed; top:0; left:0; width:0; height:0;
  display:none; z-index:2147483600; pointer-events:none;
}
#qa-video-map .qa-tile {
  position:absolute; box-sizing:border-box; transform:translate(-50%,-50%);
  appearance:none; border:2px solid transparent; border-radius:10px;
  background:transparent; padding:0; margin:0; cursor:pointer;
  pointer-events:auto; transition:border-color .12s, background-color .12s;
}
#qa-video-map .qa-tile:hover,
#qa-video-map .qa-tile:focus-visible {
  border-color:#ffce65; background-color:rgba(255,206,101,.09); outline:none;
}
#qa-video-map .qa-tooltip {
  display:block; position:absolute; left:50%; bottom:calc(100% + 4px);
  transform:translateX(-50%); pointer-events:none;
  padding:5px 9px; border:1px solid #ffce65; border-radius:6px;
  color:white; background:rgba(5,12,22,.97); opacity:0;
  white-space:nowrap; font:600 13px Georgia,serif;
}
#qa-video-map .qa-tile:hover .qa-tooltip,
#qa-video-map .qa-tile:focus-visible .qa-tooltip {opacity:1;}
#qa-return-button {
  position:fixed; right:18px; top:14px; z-index:2147483601;
  display:none; background:rgba(8,15,23,.94); color:white;
  border:1px solid #53c9f7; border-radius:8px; padding:8px 14px;
  font:600 15px Georgia,serif; cursor:pointer;
}
#qa-return-button:hover,#qa-return-button:focus-visible {
  outline:2px solid #ffce65; background:#193044;
}
#qa-hint {
  position:fixed; bottom:13px; left:50%; transform:translateX(-50%);
  z-index:2147483601; display:none; pointer-events:none;
  padding:6px 13px; border-radius:8px; color:#c5c8cf;
  background:rgba(8,15,23,.82); font:600 13px Georgia,serif;
}
body.qa-review-open #qa-video-map {display:block;}
body.qa-review-open #qa-hint {display:block;}
body.qa-review-departed #qa-return-button {display:block;}
/* Optional diagnostic: append ?qa_debug=1 to the HTML URL. */
body.qa-debug #qa-video-map .qa-tile {
  border-color:rgba(83,201,247,.85);
  background:rgba(83,201,247,.055);
}

<script>
      Reveal.initialize({
        // The "normal" size of the presentation, aspect ratio will
        // be preserved when the presentation is scaled to fit different
        // resolutions. Can be specified using percentage units.
        width: '100%',
        height: '100%',
        // Factor of the display size that should remain empty around
        // the content
        margin: 0.04,
        // Bounds for smallest/largest possible scale to apply to content
        minScale: 0.2,
        maxScale: 2.0,
        // Display presentation control arrows
        controls: false,
        // Help the user learn the controls by providing hints, for example by
        // bouncing the down arrow when they first encounter a vertical slide
        controlsTutorial: true,
        // Determines where controls appear, "edges" or "bottom-right"
        controlsLayout: 'bottom-right',
        // Visibility rule for backwards navigation arrows; "faded", "hidden"
        // or "visible"
        controlsBackArrows: 'faded',
        // Display a presentation progress bar
        progress: false,
        // Display the page number of the current slide
        // - true:    Show slide number
        // - false:   Hide slide number
        //
        // Can optionally be set as a string that specifies the number formatting:
        // - "h.v":   Horizontal . vertical slide number (default)
        // - "h/v":   Horizontal / vertical slide number
        // - "c":   Flattened slide number
        // - "c/t":   Flattened slide number / total slides
        //
        // Alternatively, you can provide a function that returns the slide
        // number for the current slide. The function should take in a slide
        // object and return an array with one string [slideNumber] or
        // three strings [n1,delimiter,n2]. See #formatSlideNumber().
        slideNumber: false,
        // Can be used to limit the contexts in which the slide number appears
        // - "all":      Always show the slide number
        // - "print":    Only when printing to PDF
        // - "speaker":  Only in the speaker view
        showSlideNumber: 'all',
        // Use 1 based indexing for # links to match slide number (default is zero
        // based)
        hashOneBasedIndex: false,
        // Add the current slide number to the URL hash so that reloading the
        // page/copying the URL will return you to the same slide
        hash: false,
        // Flags if we should monitor the hash and change slides accordingly
        respondToHashChanges: false,
        // Enable support for jump-to-slide navigation shortcuts
        jumpToSlide: true,
        // Push each slide change to the browser history.  Implies `hash: true`
        history: false,
        // Enable keyboard shortcuts for navigation
        keyboard: true,
        // Optional function that blocks keyboard events when retuning false
        //
        // If you set this to 'focused', we will only capture keyboard events
        // for embedded decks when they are in focus
        keyboardCondition: null,
        // Disables the default reveal.js slide layout (scaling and centering)
        // so that you can use custom CSS layout
        disableLayout: false,
        // Enable the slide overview mode
        overview: true,
        // Vertical centering of slides
        center: true,
        // Enables touch navigation on devices with touch input
        touch: true,
        // Loop the presentation
        loop: false,
        // Change the presentation direction to be RTL
        rtl: false,
        // Changes the behavior of our navigation directions.
        //
        // "default"
        // Left/right arrow keys step between horizontal slides, up/down
        // arrow keys step between vertical slides. Space key steps through
        // all slides (both horizontal and vertical).
        //
        // "linear"
        // Removes the up/down arrows. Left/right arrows step through all
        // slides (both horizontal and vertical).
        //
        // "grid"
        // When this is enabled, stepping left/right from a vertical stack
        // to an adjacent vertical stack will land you at the same vertical
        // index.
        //
        // Consider a deck with six slides ordered in two vertical stacks:
        // 1.1    2.1
        // 1.2    2.2
        // 1.3    2.3
        //
        // If you're on slide 1.3 and navigate right, you will normally move
        // from 1.3 -> 2.1. If "grid" is used, the same navigation takes you
        // from 1.3 -> 2.3.
        navigationMode: 'default',
        // Randomizes the order of slides each time the presentation loads
        shuffle: false,
        // Turns fragments on and off globally
        fragments: true,
        // Flags whether to include the current fragment in the URL,
        // so that reloading brings you to the same fragment position
        fragmentInURL: true,
        // Flags if the presentation is running in an embedded mode,
        // i.e. contained within a limited portion of the screen
        embedded: false,
        // Flags if we should show a help overlay when the question-mark
        // key is pressed
        help: true,
        // Flags if it should be possible to pause the presentation (blackout)
        pause: true,
        // Flags if speaker notes should be visible to all viewers
        showNotes: false,
        // Global override for autolaying embedded media (video/audio/iframe)
        // - null:   Media will only autoplay if data-autoplay is present
        // - true:   All media will autoplay, regardless of individual setting
        // - false:  No media will autoplay, regardless of individual setting
        autoPlayMedia: null,
        // Global override for preloading lazy-loaded iframes
        // - null:   Iframes with data-src AND data-preload will be loaded when within
        //           the viewDistance, iframes with only data-src will be loaded when visible
        // - true:   All iframes with data-src will be loaded when within the viewDistance
        // - false:  All iframes with data-src will be loaded only when visible
        preloadIframes: null,
        // Can be used to globally disable auto-animation
        autoAnimate: true,
        // Optionally provide a custom element matcher that will be
        // used to dictate which elements we can animate between.
        autoAnimateMatcher: null,
        // Default settings for our auto-animate transitions, can be
        // overridden per-slide or per-element via data arguments
        autoAnimateEasing: 'ease',
        autoAnimateDuration: 1.0,
        autoAnimateUnmatched: true,
        // CSS properties that can be auto-animated. Position & scale
        // is matched separately so there's no need to include styles
        // like top/right/bottom/left, width/height or margin.
        autoAnimateStyles: ['opacity', 'color', 'background-color', 'padding', 'font-size', 'line-height', 'letter-spacing', 'border-width', 'border-color', 'border-radius', 'outline', 'outline-offset'],
        // Controls automatic progression to the next slide
        // - 0:      Auto-sliding only happens if the data-autoslide HTML attribute
        //           is present on the current slide or fragment
        // - 1+:     All slides will progress automatically at the given interval
        // - false:  No auto-sliding, even if data-autoslide is present
        autoSlide: 0,
        // Stop auto-sliding after user input
        autoSlideStoppable: true,
        // Use this method for navigation when auto-sliding (defaults to navigateNext)
        autoSlideMethod: null,
        // Specify the average time in seconds that you think you will spend
        // presenting each slide. This is used to show a pacing timer in the
        // speaker view
        defaultTiming: null,
        // Enable slide navigation via mouse wheel
        mouseWheel: false,
        // Opens links in an iframe preview overlay
        // Add `data-preview-link` and `data-preview-link="false"` to customize each link
        // individually
        previewLinks: false,
        // Exposes the reveal.js API through window.postMessage
        postMessage: true,
        // Dispatches all reveal.js events to the parent window through postMessage
        postMessageEvents: false,
        // Focuses body when page changes visibility to ensure keyboard shortcuts work
        focusBodyOnPageVisibilityChange: true,
        // Transition style
        transition: 'none', // none/fade/slide/convex/concave/zoom
        // Transition speed
        transitionSpeed: 'default', // default/fast/slow
        // Transition style for full page slide backgrounds
        backgroundTransition: 'none', // none/fade/slide/convex/concave/zoom
        // The maximum number of pages a single slide can expand onto when printing
        // to PDF, unlimited by default
        pdfMaxPagesPerSlide: Number.POSITIVE_INFINITY,
        // Prints each fragment on a separate slide
        pdfSeparateFragments: true,
        // Offset used to reduce the height of content within exported PDF pages.
        // This exists to account for environment differences based on how you
        // print to PDF. CLI printing options, like phantomjs and wkpdf, can end
        // on precisely the total height of the document whereas in-browser
        // printing has to end one pixel before.
        pdfPageHeightOffset: -1,
        // Number of slides away from the current that are visible
        viewDistance: 3,
        // Number of slides away from the current that are visible on mobile
        // devices. It is advisable to set this to a lower number than
        // viewDistance in order to save resources.
        mobileViewDistance: 2,
        // The display mode that will be used to show slides
        display: 'block',
        // Hide cursor if inactive
        hideInactiveCursor: true,
        // Time before the cursor is hidden (in ms)
        hideCursorTime: 5000
      });
      // Override SPACE to play / pause the video
      Reveal.addKeyBinding(
        {
          keyCode: 32,
          key: 'SPACE',
          description: 'Play / pause video'
        },
        () => {
          var currentVideos = Reveal.getCurrentSlide().slideBackgroundContentElement.getElementsByTagName("video");
          if (currentVideos.length > 0) {
            if (currentVideos[0].paused == true) currentVideos[0].play();
            else currentVideos[0].pause();
          } else {
            Reveal.next();
          }
        }
      );

p to XGBoost" class="qa-tile" data-qa-target="105" style="left:85.0859375%;top:50.0000000%;width:21.5332031%;height:20.5800000%" title="XGBoost: click to revisit" type="button"><span class="qa-tooltip">XGBoost ↗</span></button><button aria-label="Jump to ResNet" class="qa-tile" data-qa-target="119" style="left:14.9140625%;top:75.5000000%;width:21.5332031%;height:20.5800000%" title="ResNet: click to revisit" type="button"><span class="qa-tooltip">ResNet ↗</span></button><button aria-label="Jump to Brier Score" class="qa-tile" data-qa-target="190" style="left:38.3281250%;top:75.5000000%;width:21.5332031%;height:20.5800000%" title="Brier Score: click to revisit" type="button"><span class="qa-tooltip">Brier Score ↗</span></button><button aria-label="Jump to AUC" class="qa-tile" data-qa-target="203" style="left:61.6718750%;top:75.5000000%;width:21.5332031%;height:20.5800000%" title="AUC: click to revisit" type="button"><span class="qa-tooltip">AUC ↗</span></button><button aria-label="Jump to Calibration" class="qa-tile" data-qa-target="207" style="left:85.0859375%;top:75.5000000%;width:21.5332031%;height:20.5800000%" title="Calibration: click to revisit" type="button"><span class="qa-tooltip">Calibration ↗</span></button></div><button id="qa-return-button" type="button">↩ Back to Review [Q]</button><div id="qa-hint">Q&amp;A · Click a topic to revisit · Press Q to return</div><script id="qa-aligned-script">(function() {
  'use strict';
  const TOTAL=229, REVIEW=227;
  const sections=Array.from(document.querySelectorAll('.reveal .slides > section'));
  const overlay=document.getElementById('qa-video-map');
  const returnButton=document.getElementById('qa-return-button');
  const debug=new URLSearchParams(window.location.search).get('qa_debug')==='1';
  let qaActive=false;
  if(debug)document.body.classList.add('qa-debug');
  if(sections.length!==TOTAL || !sections[REVIEW].hasAttribute('data-background-video-loop')) {
    console.error('Q&A mapping does not match this export. Navigation disabled.');return;
  }
  if(typeof Reveal==='undefined' || typeof Reveal.slide!=='function') {
    console.error('Reveal.js was not loaded.');return;
  }
  function currentIndex() {return sections.indexOf(Reveal.getCurrentSlide());}
  function isReview() {const n=currentIndex();return n===REVIEW || n===REVIEW+1;}

  // Find the actual visible video element, not a slide-section coordinate system.
  function currentBackgroundVideo() {
    const section=Reveal.getCurrentSlide();
    if(!section)return null;
    const bg=section.slideBackgroundContentElement;
    if(bg) {
      const v=bg.querySelector('video');
      if(v)return v;
    }
    const present=document.querySelector('.reveal .backgrounds .slide-background.present');
    if(present)return present.querySelector('video');
    return null;
  }

  // Translate the video element's real screen rectangle into the visible
  // 16:9 pixel region, accounting for object-fit contain/cover or letterboxing.
  function videoContentRect(video) {
    const r=video.getBoundingClientRect();
    if(!(r.width>0&&r.height>0))return null;
    const nativeW=video.videoWidth||16, nativeH=video.videoHeight||9;
    const fit=getComputedStyle(video).objectFit||'fill';
    if(fit==='fill') return {x:r.left,y:r.top,w:r.width,h:r.height};
    const scale=(fit==='cover'||fit==='scale-down'&&nativeW<=r.width&&nativeH<=r.height)
      ?Math.max(r.width/nativeW,r.height/nativeH)
      :Math.min(r.width/nativeW,r.height/nativeH);
    const w=nativeW*scale,h=nativeH*scale;
    return {x:r.left+(r.width-w)/2,y:r.top+(r.height-h)/2,w,h};
  }

  // If Reveal has not constructed the background video yet, use its visible
  // slideshow viewport as a temporary contained 16:9 rectangle and correct
  // the result when the metadata arrives.
  function fallbackRect() {
    const base=document.querySelector('.reveal')||document.documentElement;
    const r=base.getBoundingClientRect();
    const w=Math.min(r.width,r.height*16/9), h=w*9/16;
    return {x:r.left+(r.width-w)/2,y:r.top+(r.height-h)/2,w,h};
  }

  function align() {
    if(!isReview())return;
    const v=currentBackgroundVideo();
    const r=(v&&videoContentRect(v))||fallbackRect();
    overlay.style.left=r.x+'px';overlay.style.top=r.y+'px';
    overlay.style.width=r.w+'px';overlay.style.height=r.h+'px';
    // Metadata may arrive after the first layout; remeasure then.
    if(v && !v.__qaAlignmentBound) {
      v.addEventListener('loadedmetadata',scheduleAlign);
      v.addEventListener('resize',scheduleAlign);
      v.__qaAlignmentBound=true;
    }
  }
  let pending=false;
  function scheduleAlign() {
    if(pending)return;pending=true;
    requestAnimationFrame(()=>{pending=false;align();});
  }

  function updateUI() {
    const review=isReview();
    document.body.classList.toggle('qa-review-open',review);
    document.body.classList.toggle('qa-review-departed',qaActive&&!review);
    if(review){scheduleAlign();}
  }
  function goto(index) {
    const idx=Number(index);
    if(!Number.isInteger(idx)||idx<0||idx>=TOTAL)return;
    qaActive=true;Reveal.slide(idx,0,0);updateUI();
  }
  function backToReview(){goto(REVIEW);}
  overlay.querySelectorAll('.qa-tile').forEach(btn=>btn.addEventListener('click',e=>{
    e.preventDefault();e.stopPropagation();goto(btn.dataset.qaTarget);
  }));
  returnButton.addEventListener('click',e=>{
    e.preventDefault();e.stopPropagation();backToReview();
  });
  document.addEventListener('keydown',e=>{
    const t=e.target;
    if(t?.isContentEditable||['INPUT','TEXTAREA'].includes(t?.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;
    if(e.key.toLowerCase()==='q'){
      e.preventDefault();e.stopImmediatePropagation();backToReview();
    }
  },true);
  Reveal.on('slidechanged',updateUI);
  Reveal.on('ready',updateUI);
  window.addEventListener('resize',scheduleAlign);
  document.addEventListener('fullscreenchange',scheduleAlign);
  if(window.visualViewport)window.visualViewport.addEventListener('resize',scheduleAlign);
  updateUI();
})();</script></body>
